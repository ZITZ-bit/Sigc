# /etc/nginx/conf.d/sigc-hospital-production.conf
# Arquitectura Web Hospitalaria de Grado Médico para SIGC

# 1. Zona de Limitación de Tasa (DDoS & Brute Force Protection)
limit_req_zone $binary_remote_addr zone=sigc_login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=sigc_conn_limit:10m;

server {
    listen 80;
    server_name portal.clinicasigc.com;
    # Redirección estricta HTTP a HTTPS con código 301 permanente
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.clinicasigc.com;

    # Certificado TLS Dedicado EV (Extended Validation)
    ssl_certificate /etc/ssl/certs/clinicasigc.crt;
    ssl_certificate_key /etc/ssl/private/clinicasigc.key;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Protocolos Criptográficos Seguros (Solo TLS 1.3 y 1.2)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling para validación rápida de revocación de certificados
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # CABECERAS DE SEGURIDAD OBLIGATORIAS DE GRADO HOSPITALARIO
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Content-Security-Policy Estricta (Mitigación total XSS y Robo de Sesión)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://assets.clinicasigc.com; img-src 'self' data: https://assets.clinicasigc.com; font-src 'self' https://assets.clinicasigc.com; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self';" always;

    # Denegar acceso a archivos sensibles (.env, .git, .map)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protección Perimetral del Endpoint de Login
    location = /login {
        limit_req zone=sigc_login_limit burst=3 nodelay;
        limit_conn sigc_conn_limit 5;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }
}
